name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build Windows x64 binaries
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          New-Item -ItemType Directory -Force bin | Out-Null

          go build -trimpath -ldflags "-s -w -X main.version=$version" -o bin/orchestrator.exe ./cmd/orchestrator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$version" -o bin/orchestrator-daemon.exe ./cmd/orchestrator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          go build -trimpath -ldflags "-s -w" -o bin/desktop-companion.exe ./cmd/desktop-companion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $appVersion = $tag.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }

          & $iscc "/DAppVersion=$appVersion" installer\CodexQuotaGuard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $built = 'dist\CodexQuotaGuardSetup.exe'
          $releaseName = "CodexQuotaGuardSetup-$tag.exe"
          if (-not (Test-Path $built)) {
            throw "Installer was not produced: $built"
          }
          Move-Item $built $releaseName -Force

      - name: Smoke-test installer payload
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $installer = "CodexQuotaGuardSetup-$tag.exe"

          $required = @(
            'bin/orchestrator.exe',
            'bin/orchestrator-daemon.exe',
            'bin/desktop-companion.exe',
            'installer/CodexQuotaGuard.iss'
          )
          foreach ($relative in $required) {
            if (-not (Test-Path $relative -PathType Leaf)) {
              throw "Release build missing required file: $relative"
            }
          }

          $actualVersion = & .\bin\orchestrator.exe version
          if ($LASTEXITCODE -ne 0) {
            throw 'orchestrator.exe version command failed'
          }
          if ($actualVersion.Trim() -ne $tag) {
            throw "Version mismatch: tag=$tag binary=$actualVersion"
          }

          if (-not (Test-Path $installer -PathType Leaf)) {
            throw "Installer missing: $installer"
          }
          if ((Get-Item $installer).Length -le 0) {
            throw "Installer is empty: $installer"
          }

          Get-FileHash $installer -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $installer" } |
            Set-Content "$installer.sha256"

          $hashLine = Get-Content "$installer.sha256" -Raw
          $expectedHash = ($hashLine -split '\s+')[0].Trim().ToLower()
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($expectedHash -ne $actualHash) {
            throw 'SHA256 sidecar does not match installer'
          }

          Write-Host "Installer smoke test passed for $tag"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CodexQuotaGuardSetup-${{ github.ref_name }}.exe
            CodexQuotaGuardSetup-${{ github.ref_name }}.exe.sha256
