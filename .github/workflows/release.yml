name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build Windows x64
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          New-Item -ItemType Directory -Force bin | Out-Null

          go build -trimpath -ldflags "-s -w -X main.version=$version" -o bin/orchestrator.exe ./cmd/orchestrator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$version" -o bin/orchestrator-daemon.exe ./cmd/orchestrator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          go build -trimpath -ldflags "-s -w" -o bin/desktop-companion.exe ./cmd/desktop-companion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$version" -o CodexQuotaGuardSetup.exe ./cmd/setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          $package = "codex-quota-orchestrator-$version-windows-x64"
          New-Item -ItemType Directory -Force "$package/bin" | Out-Null
          New-Item -ItemType Directory -Force "$package/docs" | Out-Null

          Copy-Item CodexQuotaGuardSetup.exe "$package/"
          Copy-Item bin/orchestrator.exe "$package/bin/"
          Copy-Item bin/orchestrator-daemon.exe "$package/bin/"
          Copy-Item bin/desktop-companion.exe "$package/bin/"
          Copy-Item config.example.json "$package/"
          Copy-Item README.md "$package/"
          Copy-Item docs/WINDOWS_SETUP.md "$package/docs/"
          Copy-Item docs/ARCHITECTURE.md "$package/docs/"
          Copy-Item docs/TROUBLESHOOTING.md "$package/docs/"

          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip" -Force
          Get-FileHash "$package.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $package.zip" } | Set-Content "$package.zip.sha256"

      - name: Smoke-test assembled package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          $package = "codex-quota-orchestrator-$version-windows-x64"
          $smoke = Join-Path $PWD "smoke-package"
          Remove-Item $smoke -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "$package.zip" -DestinationPath $smoke -Force

          $required = @(
            "CodexQuotaGuardSetup.exe",
            "bin/orchestrator.exe",
            "bin/orchestrator-daemon.exe",
            "bin/desktop-companion.exe",
            "config.example.json",
            "README.md",
            "docs/WINDOWS_SETUP.md",
            "docs/ARCHITECTURE.md",
            "docs/TROUBLESHOOTING.md"
          )

          foreach ($relative in $required) {
            $path = Join-Path $smoke $relative
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Release package missing required file: $relative"
            }
            if ((Get-Item $path).Length -le 0) {
              throw "Release package contains empty file: $relative"
            }
          }

          $actualVersion = & (Join-Path $smoke "bin/orchestrator.exe") version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged orchestrator.exe version command failed"
          }
          if ($actualVersion.Trim() -ne $version) {
            throw "Version mismatch: tag=$version packaged=$actualVersion"
          }

          $hashLine = Get-Content "$package.zip.sha256" -Raw
          $expectedHash = ($hashLine -split '\s+')[0].Trim().ToLower()
          $actualHash = (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLower()
          if ($expectedHash -ne $actualHash) {
            throw "SHA256 sidecar does not match assembled ZIP"
          }

          Write-Host "Release package smoke test passed for $version"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            codex-quota-orchestrator-${{ github.ref_name }}-windows-x64.zip
            codex-quota-orchestrator-${{ github.ref_name }}-windows-x64.zip.sha256
