<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Codex Quota Guard</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e5e7eb;background:#0b1020}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1020,#111827 45%,#0b1020);min-height:100vh}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{border-right:1px solid #243047;background:rgba(10,15,30,.92);padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:800;margin-bottom:24px}.brand small{display:block;color:#94a3b8;font-size:11px;font-weight:600;margin-top:4px}.nav button{width:100%;border:0;background:transparent;color:#aab4c5;text-align:left;padding:11px 12px;border-radius:10px;margin:3px 0;cursor:pointer;font-weight:650}.nav button.active,.nav button:hover{background:#172036;color:#fff}.main{padding:24px;min-width:0}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.title{font-size:26px;font-weight:800}.muted{color:#94a3b8}.status{display:flex;align-items:center;gap:8px;font-size:13px;color:#cbd5e1}.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.12)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:rgba(17,24,39,.92);border:1px solid #263249;border-radius:16px;padding:16px}.metric-label{font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em}.metric-value{font-size:30px;font-weight:800;margin-top:8px}.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section-title{font-size:17px;font-weight:750}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #31415f;background:#172036;color:#e5e7eb;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:650}.btn:hover{background:#1d2945}.btn.primary{background:#2563eb;border-color:#2563eb}.btn.danger{background:#7f1d1d;border-color:#991b1b}.btn.ghost{background:transparent}.input,.select,.textarea{width:100%;background:#0e1628;border:1px solid #31415f;color:#e5e7eb;border-radius:10px;padding:10px 11px;outline:none}.textarea{min-height:100px;resize:vertical}.filters{display:grid;grid-template-columns:minmax(220px,1fr) 180px 220px;gap:10px;margin-bottom:12px}.table-wrap{overflow:auto;border:1px solid #263249;border-radius:14px;background:#111827}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #202c42;font-size:13px}th{color:#94a3b8;font-weight:700;background:#101727;position:sticky;top:0}tr:hover td{background:#141d31}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.RUNNING{background:#123b2a;color:#86efac}.PAUSED_QUOTA,.PAUSE_REQUESTED{background:#4a3210;color:#fde68a}.COMPLETED{background:#19324d;color:#93c5fd}.NEEDS_REVIEW{background:#4c1d2f;color:#f9a8d4}.FAILED,.CANCELLED{background:#3b2222;color:#fca5a5}.RESUME_QUEUED{background:#312e81;color:#c7d2fe}.project-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.project-card{cursor:pointer}.project-card:hover{border-color:#42608f}.project-name{font-weight:800;font-size:16px}.project-path{font-size:12px;color:#94a3b8;margin-top:6px;word-break:break-all}.project-desc{font-size:13px;color:#cbd5e1;margin-top:10px;min-height:34px}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-bg.show{display:flex}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#101827;border:1px solid #31415f;border-radius:18px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.45)}.modal h3{margin:0 0 14px}.field{margin:12px 0}.field label{display:block;color:#94a3b8;font-size:12px;font-weight:700;margin-bottom:6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kv{background:#0e1628;border:1px solid #263249;border-radius:12px;padding:11px}.kv b{display:block;color:#94a3b8;font-size:11px;text-transform:uppercase;margin-bottom:5px}.timeline{margin-top:14px}.event{padding:10px 0;border-bottom:1px solid #263249;font-size:13px}.event .time{color:#94a3b8;font-size:11px}.empty{padding:32px;text-align:center;color:#94a3b8}.toast{position:fixed;right:20px;bottom:20px;background:#111827;border:1px solid #31415f;padding:12px 14px;border-radius:10px;display:none;z-index:50}.toast.show{display:block}.danger-text{color:#fca5a5}.recovery-list{display:grid;gap:12px}.recovery-card{border-color:#5d2b45}.recovery-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.recovery-title{font-size:16px;font-weight:800}.recovery-source{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#f9a8d4;margin-bottom:6px}.recovery-reason{margin:12px 0;padding:11px 12px;border-radius:10px;background:#261521;border:1px solid #5d2b45;color:#fecdd3;font-size:13px}.recovery-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}.recovery-meta .kv{min-width:0;word-break:break-word}.recovery-help{font-size:12px;color:#cbd5e1;margin:10px 0}.action-meta{font-size:12px;color:#94a3b8;margin-top:6px}.warning{padding:10px 12px;border:1px solid #854d0e;background:#2b1d0b;color:#fde68a;border-radius:10px;font-size:12px;margin:12px 0}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.project-list{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:static;border-right:0;border-bottom:1px solid #243047}.nav{display:flex;gap:6px;overflow:auto}.nav button{width:auto;white-space:nowrap}.main{padding:16px}.grid,.project-list,.row,.detail-grid,.filters,.recovery-meta{grid-template-columns:1fr}.filters .search{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Codex Quota Guard<small>Local Task Manager</small></div>
    <div class="nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="projects">Projects</button>
      <button data-view="tasks">Tasks</button>
      <button data-view="review">Needs Review</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><div id="pageTitle" class="title">Dashboard</div><div id="pageSubtitle" class="muted">Local Codex Desktop task overview</div></div>
      <div class="status"><span class="dot"></span><span id="daemonStatus">Connected</span></div>
    </div>
    <div id="content"></div>
  </main>
</div>
<div id="modalBg" class="modal-bg"><div id="modal" class="modal"></div></div>
<div id="toast" class="toast"></div>
<script>
const state={view:'dashboard',projects:[],tasks:[],recovery:[],summary:null};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts}); if(!r.ok){let m=await r.text();try{m=JSON.parse(m).error||m}catch{}throw new Error(m||r.statusText)} if(r.status===204)return null; return r.json()}
function toast(msg,bad=false){const t=$('#toast');t.textContent=msg;t.className='toast show'+(bad?' danger-text':'');setTimeout(()=>t.className='toast',2600)}
function badge(s){return `<span class="badge ${esc(s)}">${esc(s)}</span>`}
function pct(w){return w?.available?`${Math.round(w.remainingPercent)}%`:'—'}
function fmtTime(v){return v?new Date(v).toLocaleString():''}
async function refresh(){try{const [summary,projects,tasks,recovery]=await Promise.all([api('/v1/dashboard'),api('/v1/projects?archived=all'),api('/v1/dashboard/tasks?archived=all'),api('/v1/dashboard/tasks/recovery')]);state.summary=summary;state.projects=projects;state.tasks=tasks;state.recovery=recovery;$('#daemonStatus').textContent='Connected';render()}catch(e){$('#daemonStatus').textContent='Disconnected';toast(e.message,true)}}
function render(){document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===state.view);if(b.dataset.view==='review')b.textContent=`Needs Review${state.recovery.length?` (${state.recovery.length})`:''}`}); if(state.view==='dashboard')renderDashboard(); if(state.view==='projects')renderProjects(); if(state.view==='tasks')renderTasks(); if(state.view==='review')renderRecovery()}
function setTitle(t,s){$('#pageTitle').textContent=t;$('#pageSubtitle').textContent=s}
function renderDashboard(){setTitle('Dashboard','Quota, projects and recent task activity');const s=state.summary||{},q=s.quota||{},states=s.states||{};const recent=state.tasks.filter(t=>!t.archived).slice(0,8);const reviewCount=s.reviewCount??state.recovery.length;$('#content').innerHTML=`<div class="grid">
<div class="card"><div class="metric-label">5h quota</div><div class="metric-value">${pct(q.fiveHour)}</div></div>
<div class="card"><div class="metric-label">Weekly quota</div><div class="metric-value">${pct(q.weekly)}</div></div>
<div class="card"><div class="metric-label">Running</div><div class="metric-value">${states.RUNNING||0}</div></div>
<div class="card"><div class="metric-label">Paused / Review</div><div class="metric-value">${(states.PAUSED_QUOTA||0)+reviewCount}</div></div></div>
${reviewCount?`<div class="section"><div class="warning">${reviewCount} item${reviewCount===1?'':'s'} require manual review before safe automatic progression can continue. <button class="btn" style="margin-left:8px" onclick="go('review')">Review now</button></div></div>`:''}
<div class="section"><div class="section-head"><div class="section-title">Recent tasks</div><button class="btn" onclick="go('tasks')">View all</button></div>${taskTable(recent)}</div>`}
function renderProjects(){setTitle('Projects','Group managed tasks by workspace/project');const items=state.projects;$('#content').innerHTML=`<div class="section-head"><div class="muted">${items.length} projects</div><button class="btn primary" onclick="projectForm()">New project</button></div><div class="project-list">${items.map(p=>`<div class="card project-card" onclick='showProject(${JSON.stringify(JSON.stringify(p))})'><div class="project-name">${esc(p.name)} ${p.archived?'<span class="muted">(archived)</span>':''}</div><div class="project-path">${esc(p.path||'No workspace path')}</div><div class="project-desc">${esc(p.description||'No description')}</div><div class="muted" style="margin-top:10px;font-size:12px">${state.tasks.filter(t=>t.projectId===p.id&&!t.archived).length} active/history tasks</div></div>`).join('')}</div>`}
function renderTasks(){setTitle('Tasks','Search, filter and manage task history');const projects=state.projects.filter(p=>!p.archived);$('#content').innerHTML=`<div class="filters"><input id="taskSearch" class="input search" placeholder="Search objective, workspace, thread..." oninput="applyTaskFilters()"><select id="taskState" class="select" onchange="applyTaskFilters()"><option value="">All states</option>${['RUNNING','PAUSE_REQUESTED','PAUSED_QUOTA','RESUME_QUEUED','NEEDS_REVIEW','COMPLETED','FAILED','CANCELLED'].map(s=>`<option>${s}</option>`).join('')}</select><select id="taskProject" class="select" onchange="applyTaskFilters()"><option value="">All projects</option>${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div id="taskTableHost"></div>`;applyTaskFilters()}
function applyTaskFilters(){const q=($('#taskSearch')?.value||'').toLowerCase(),st=$('#taskState')?.value||'',pid=$('#taskProject')?.value||'';let items=state.tasks.filter(t=>!t.archived);if(st)items=items.filter(t=>t.state===st);if(pid)items=items.filter(t=>t.projectId===pid);if(q)items=items.filter(t=>[t.objective,t.workspace,t.threadId,t.notes].join(' ').toLowerCase().includes(q));$('#taskTableHost').innerHTML=taskTable(items)}
function taskTable(items){if(!items.length)return '<div class="card empty">No tasks found.</div>';return `<div class="table-wrap"><table><thead><tr><th>Status</th><th>Objective</th><th>Project</th><th>Workspace</th><th>Updated</th></tr></thead><tbody>${items.map(t=>`<tr onclick='showTask(${JSON.stringify(t.id)})' style="cursor:pointer"><td>${badge(t.state)}</td><td>${esc(t.objective)}</td><td>${esc(t.projectName||'Unassigned')}</td><td>${esc(t.workspace||'—')}</td><td>${esc(fmtTime(t.updatedAt))}</td></tr>`).join('')}</tbody></table></div>`}
function renderRecovery(){setTitle('Needs Review','Resolve uncertain Desktop deliveries without blind retries');const items=[...state.recovery].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));if(!items.length){$('#content').innerHTML='<div class="card empty">Nothing needs review. Automatic task progression is clear.</div>';return}$('#content').innerHTML=`<div class="warning">Before choosing Retry, inspect the destination Codex Desktop thread and confirm the previous uncertain message did not arrive. If it did arrive, choose Mark running instead.</div><div class="recovery-list">${items.map(recoveryCard).join('')}</div>`}
function recoveryCard(x){const source=x.source==='project_task'?'Project queue dispatch':'Managed resume';const action=x.action?`Action #${x.action.id} · ${esc(x.action.kind)} · ${esc(x.action.status)} · ${esc(fmtTime(x.action.updatedAt))}`:'No delivery action metadata found';const details=x.details?`<div class="recovery-help"><b>Details / recovery note:</b><br>${esc(x.details)}</div>`:'';return `<div class="card recovery-card"><div class="recovery-head"><div><div class="recovery-source">${source}</div><div class="recovery-title">${esc(x.objective)}</div></div>${badge(x.state)}</div><div class="recovery-reason">${esc(x.reason||'Manual recovery required')}</div><div class="recovery-meta"><div class="kv"><b>Project</b>${esc(x.projectName||'Unassigned')}</div><div class="kv"><b>Thread</b>${esc(x.threadId||'—')}</div><div class="kv"><b>Updated</b>${esc(fmtTime(x.updatedAt))}</div></div>${details}<div class="action-meta">${action}</div><div class="recovery-help">Retry sends or schedules a fresh delivery only after you confirm the uncertain delivery did not arrive. Mark running sends nothing; it records that Desktop is already executing the work.</div><div class="toolbar"><button class="btn primary" onclick='recoveryAction(${JSON.stringify(x.source)},${JSON.stringify(x.id)},"retry")'>Retry delivery</button><button class="btn" onclick='recoveryAction(${JSON.stringify(x.source)},${JSON.stringify(x.id)},"running")'>Mark running</button><button class="btn danger" onclick='recoveryAction(${JSON.stringify(x.source)},${JSON.stringify(x.id)},"cancel")'>Cancel</button></div></div>`}
async function recoveryAction(source,id,action){if(action==='retry'&&!confirm('Retry only after checking the Codex Desktop thread and confirming the previous uncertain delivery did NOT arrive. Retry now?'))return;if(action==='running'&&!confirm('Confirm that the uncertain message DID arrive and this task is already running in Codex Desktop?'))return;if(action==='cancel'&&!confirm('Cancel this recovery item? No new Desktop message will be sent.'))return;const path=source==='project_task'?`/v1/project-tasks/${id}/${action}`:`/v1/dashboard/tasks/${id}/${action}`;try{await api(path,{method:'POST',body:'{}'});toast(action==='running'?'Marked as running':action==='retry'?'Recovery retry accepted':'Cancelled');closeModal();await refresh()}catch(e){toast(e.message,true);await refresh()}}
function go(v){state.view=v;render()}
function openModal(html){$('#modal').innerHTML=html;$('#modalBg').classList.add('show')}
function closeModal(){ $('#modalBg').classList.remove('show') }
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
function projectForm(p=null){openModal(`<h3>${p?'Edit project':'New project'}</h3><div class="field"><label>Name</label><input id="pName" class="input" value="${esc(p?.name||'')}"></div><div class="field"><label>Workspace path</label><input id="pPath" class="input" value="${esc(p?.path||'')}"></div><div class="field"><label>Description</label><textarea id="pDesc" class="textarea">${esc(p?.description||'')}</textarea></div>${p?`<div class="field"><label><input id="pArchived" type="checkbox" ${p.archived?'checked':''}> Archived</label></div>`:''}<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick='saveProject(${p?JSON.stringify(p.id):'null'})'>Save</button></div>`)}
async function saveProject(id){try{const body={name:$('#pName').value,path:$('#pPath').value,description:$('#pDesc').value};if(id)body.archived=$('#pArchived').checked;await api(id?`/v1/projects/${id}`:'/v1/projects',{method:id?'PATCH':'POST',body:JSON.stringify(body)});closeModal();toast('Project saved');await refresh()}catch(e){toast(e.message,true)}}
function showProject(raw){const p=JSON.parse(raw);const tasks=state.tasks.filter(t=>t.projectId===p.id);openModal(`<div class="section-head"><h3>${esc(p.name)}</h3><div class="toolbar"><button class="btn" onclick='projectForm(${JSON.stringify(p)})'>Edit</button><button class="btn danger" onclick='deleteProject(${JSON.stringify(p.id)})'>Delete</button></div></div><div class="muted">${esc(p.path||'No workspace path')}</div><p>${esc(p.description||'No description')}</p><div class="section-title" style="margin:16px 0 8px">Tasks</div>${taskTable(tasks)}`)}
async function deleteProject(id){if(!confirm('Delete this project? Tasks will be kept but unassigned.'))return;try{await api(`/v1/projects/${id}`,{method:'DELETE'});closeModal();toast('Project deleted');await refresh()}catch(e){toast(e.message,true)}}
async function showTask(id){try{const [t,events]=await Promise.all([api(`/v1/dashboard/tasks/${id}`),api(`/v1/dashboard/tasks/${id}/events`)]);const projects=state.projects.filter(p=>!p.archived),rec=state.recovery.find(x=>x.source==='managed_task'&&x.id===id);const recovery=rec?`<div class="recovery-reason">${esc(rec.reason||'Manual recovery required')}</div><div class="action-meta">${rec.action?`Action #${rec.action.id} · ${esc(rec.action.status)} · ${esc(fmtTime(rec.action.updatedAt))}`:'No delivery action metadata found'}</div><div class="warning">Inspect the destination Desktop thread before choosing Retry or Mark running.</div>`:'';openModal(`<div class="section-head"><h3>${esc(t.objective)}</h3>${badge(t.state)}</div><div class="detail-grid"><div class="kv"><b>Thread</b>${esc(t.threadId)}</div><div class="kv"><b>Project</b>${esc(t.projectName||'Unassigned')}</div><div class="kv"><b>Workspace</b>${esc(t.workspace||'—')}</div><div class="kv"><b>Last quota</b>${t.lastQuotaRemaining!=null?Math.round(t.lastQuotaRemaining)+'%':'—'}</div></div>${recovery}<div class="field"><label>Objective</label><input id="tObjective" class="input" value="${esc(t.objective)}"></div><div class="field"><label>Project</label><select id="tProject" class="select"><option value="">Unassigned</option>${projects.map(p=>`<option value="${p.id}" ${p.id===t.projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Notes</label><textarea id="tNotes" class="textarea">${esc(t.notes||'')}</textarea></div><div class="row"><div class="kv"><b>Checkpoint</b>${esc(t.checkpoint||'—')}</div><div class="kv"><b>Pending</b>${esc(t.pending||'—')}</div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick='saveTask(${JSON.stringify(t.id)})'>Save metadata</button>${t.state==='RUNNING'?`<button class="btn" onclick='taskAction(${JSON.stringify(t.id)},"pause")'>Request pause</button>`:''}${t.state==='NEEDS_REVIEW'?`<button class="btn" onclick='recoveryAction("managed_task",${JSON.stringify(t.id)},"retry")'>Retry delivery</button><button class="btn" onclick='recoveryAction("managed_task",${JSON.stringify(t.id)},"running")'>Mark running</button>`:''}${!['COMPLETED','FAILED','CANCELLED'].includes(t.state)?`<button class="btn danger" onclick='taskAction(${JSON.stringify(t.id)},"cancel")'>Cancel</button>`:`<button class="btn danger" onclick='deleteTask(${JSON.stringify(t.id)})'>Delete</button>`}</div><div class="timeline"><div class="section-title">Timeline</div>${events.length?events.map(e=>`<div class="event"><div>${badge(e.toState)} ${esc(e.reason||'')}</div><div class="time">${esc(fmtTime(e.createdAt))} · ${esc(e.fromState)} → ${esc(e.toState)}</div></div>`).join(''):'<div class="empty">No state events yet.</div>'}</div>`)}catch(e){toast(e.message,true)}}
async function saveTask(id){try{await api(`/v1/dashboard/tasks/${id}`,{method:'PATCH',body:JSON.stringify({objective:$('#tObjective').value,projectId:$('#tProject').value,notes:$('#tNotes').value})});toast('Task updated');closeModal();await refresh()}catch(e){toast(e.message,true)}}
async function taskAction(id,action){if(action==='cancel'&&!confirm('Cancel this task? Pending Desktop messages will be invalidated. If a resume delivery is already in progress, the task will move to NEEDS_REVIEW instead of pretending it was cancelled.'))return;try{await api(`/v1/dashboard/tasks/${id}/${action}`,{method:'POST',body:'{}'});toast(`Task action: ${action}`);closeModal();await refresh()}catch(e){toast(e.message,true);if(action==='cancel'){closeModal();await refresh()}}}
async function deleteTask(id){if(!confirm('Delete this terminal task and its event history?'))return;try{await api(`/v1/dashboard/tasks/${id}`,{method:'DELETE'});closeModal();toast('Task deleted');await refresh()}catch(e){toast(e.message,true)}}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));refresh();setInterval(refresh,15000);
</script>
</body>
</html>
