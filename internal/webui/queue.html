<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project Task Queue</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e5e7eb;background:#0b1020}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1020,#111827 45%,#0b1020);min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.title{font-size:28px;font-weight:800}.muted{color:#94a3b8}.card{background:#111827;border:1px solid #263249;border-radius:16px;padding:16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input,.select,.textarea{background:#0e1628;border:1px solid #31415f;color:#e5e7eb;border-radius:10px;padding:10px 11px}.select{min-width:260px}.textarea{width:100%;min-height:110px;resize:vertical}.btn{border:1px solid #31415f;background:#172036;color:#e5e7eb;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:650}.btn.primary{background:#2563eb;border-color:#2563eb}.btn.danger{background:#7f1d1d;border-color:#991b1b}.btn:disabled{opacity:.45;cursor:not-allowed}.queue{display:grid;gap:10px;margin-top:16px}.item{display:grid;grid-template-columns:70px minmax(0,1fr) 130px auto;gap:12px;align-items:center;padding:14px;border:1px solid #263249;border-radius:14px;background:#101827}.pos{font-weight:800;color:#94a3b8}.objective{font-weight:750}.details{font-size:12px;color:#94a3b8;margin-top:5px;white-space:pre-wrap}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.QUEUED{background:#1e293b;color:#cbd5e1}.DISPATCHING,.DISPATCHED{background:#312e81;color:#c7d2fe}.RUNNING{background:#123b2a;color:#86efac}.COMPLETED{background:#19324d;color:#93c5fd}.NEEDS_REVIEW{background:#4c1d2f;color:#f9a8d4}.CANCELLED{background:#3b2222;color:#fca5a5}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:40px;text-align:center;color:#94a3b8}.hint{margin-top:12px;color:#94a3b8;font-size:13px;line-height:1.5}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px}.modal-bg.show{display:flex}.modal{width:min(620px,100%);background:#101827;border:1px solid #31415f;border-radius:18px;padding:18px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#94a3b8;font-weight:700;margin-bottom:6px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;border:1px solid #31415f;padding:12px 14px;border-radius:10px;display:none}.toast.show{display:block}@media(max-width:850px){.item{grid-template-columns:50px 1fr}.item .state,.item .actions{grid-column:2}.select{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="title">Project Task Queue</div><div class="muted">Sequential work per project</div></div>
    <a class="btn" href="/">Back to Dashboard</a>
  </div>
  <div class="card">
    <div class="toolbar">
      <select id="project" class="select"></select>
      <button class="btn primary" onclick="openCreate()">Add queued task</button>
      <button class="btn" onclick="loadQueue()">Refresh</button>
    </div>
    <div class="hint">Only one queue item runs per project. The next item is dispatched only after the previous managed task is <b>COMPLETED</b> and quota is healthy. FAILED, CANCELLED, or NEEDS_REVIEW stops automatic advancement.</div>
    <div id="queue" class="queue"></div>
  </div>
</div>
<div id="modalBg" class="modal-bg"><div id="modal" class="modal"></div></div>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);let projects=[],items=[];
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});if(!r.ok){let m=await r.text();try{m=JSON.parse(m).error||m}catch{}throw new Error(m||r.statusText)}if(r.status===204)return null;return r.json()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(m){const t=$('#toast');t.textContent=m;t.className='toast show';setTimeout(()=>t.className='toast',2200)}
async function init(){projects=await api('/v1/projects');const p=$('#project');p.innerHTML=projects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');p.onchange=loadQueue;if(projects.length)loadQueue();else $('#queue').innerHTML='<div class="empty">Create a project first.</div>'}
async function loadQueue(){const pid=$('#project').value;if(!pid)return;items=await api('/v1/project-tasks?projectId='+encodeURIComponent(pid));render()}
function render(){if(!items.length){$('#queue').innerHTML='<div class="empty">No queued work yet.</div>';return}$('#queue').innerHTML=items.map(x=>`<div class="item"><div class="pos">#${x.position}</div><div><div class="objective">${esc(x.objective)}</div><div class="details">${esc(x.details||'')}</div>${x.targetThreadId?`<div class="details">thread: ${esc(x.targetThreadId)}</div>`:''}</div><div class="state"><span class="badge ${x.state}">${x.state}</span></div><div class="actions">${x.state==='QUEUED'?`<button class="btn" onclick='editItem(${JSON.stringify(x.id)})'>Edit</button><button class="btn" onclick='move(${JSON.stringify(x.id)},-1)'>↑</button><button class="btn" onclick='move(${JSON.stringify(x.id)},1)'>↓</button><button class="btn danger" onclick='cancelItem(${JSON.stringify(x.id)})'>Cancel</button>`:''}${['QUEUED','CANCELLED','COMPLETED'].includes(x.state)?`<button class="btn danger" onclick='deleteItem(${JSON.stringify(x.id)})'>Delete</button>`:''}</div></div>`).join('')}
function openCreate(){const pid=$('#project').value;if(!pid)return;openModal(`<h3>Add queued task</h3><div class="field"><label>Objective</label><input id="objective" class="input" style="width:100%"></div><div class="field"><label>Details / acceptance criteria</label><textarea id="details" class="textarea"></textarea></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createItem()">Add to queue</button></div>`)}
async function createItem(){await api('/v1/project-tasks',{method:'POST',body:JSON.stringify({projectId:$('#project').value,objective:$('#objective').value,details:$('#details').value})});closeModal();toast('Task added');await loadQueue()}
function editItem(id){const x=items.find(i=>i.id===id);openModal(`<h3>Edit queued task</h3><div class="field"><label>Objective</label><input id="objective" class="input" style="width:100%" value="${esc(x.objective)}"></div><div class="field"><label>Details</label><textarea id="details" class="textarea">${esc(x.details||'')}</textarea></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick='saveItem(${JSON.stringify(id)})'>Save</button></div>`)}
async function saveItem(id){await api('/v1/project-tasks/'+id,{method:'PATCH',body:JSON.stringify({objective:$('#objective').value,details:$('#details').value})});closeModal();toast('Saved');await loadQueue()}
async function move(id,delta){const x=items.find(i=>i.id===id);if(!x)return;const target=Math.max(1,x.position+delta);await api('/v1/project-tasks/'+id,{method:'PATCH',body:JSON.stringify({objective:x.objective,details:x.details,position:target})});await loadQueue()}
async function cancelItem(id){if(!confirm('Cancel this queued task?'))return;await api('/v1/project-tasks/'+id+'/cancel',{method:'POST',body:'{}'});await loadQueue()}
async function deleteItem(id){if(!confirm('Delete this queue item?'))return;await api('/v1/project-tasks/'+id,{method:'DELETE'});await loadQueue()}
function openModal(h){$('#modal').innerHTML=h;$('#modalBg').classList.add('show')}function closeModal(){$('#modalBg').classList.remove('show')}$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});init().catch(e=>toast(e.message));
</script>
</body>
</html>
